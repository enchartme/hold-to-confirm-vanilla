<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hold-to-confirm-vanilla demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b1020;
        color: #eef2ff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 10%, #312e8140, transparent 35rem),
          #0b1020;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #ffffff18;
        border-radius: 1.5rem;
        background: #151a2dcc;
        box-shadow: 0 2rem 6rem #0008;
      }

      h1 { margin: 0 0 .5rem; letter-spacing: -.04em; }
      p { color: #aab2d5; line-height: 1.55; }
      .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin: 2rem 0; }

      button {
        min-width: 10rem;
        padding: .8rem 1.1rem;
        border: 1px solid #ffffff24;
        border-radius: .7rem;
        background: #222942;
        color: inherit;
        font: inherit;
        font-weight: 650;
      }

      #delete-button {
        --hold-danger-color: rgb(244 63 94 / 38%);
        --hold-indicator-color: #fb7185;
        --hold-surface-color: #222942;
      }

      #archive-button {
        --hold-progress-color: rgb(56 189 248 / 35%);
        --hold-indicator-color: #38bdf8;
        --hold-surface-color: #222942;
      }

      output {
        display: block;
        min-height: 1.5rem;
        color: #c7d2fe;
      }

      code { color: #a5b4fc; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hold to confirm</h1>
      <p>
        Press and hold a button for its full duration. Releasing, leaving the
        button, or losing focus cancels the action. Keyboard users can hold
        <code>Space</code> or <code>Enter</code>.
      </p>
      <div class="actions">
        <button id="delete-button" type="button">Hold to delete</button>
        <button id="archive-button" type="button">Hold to archive</button>
        <button id="reset-button" type="button">Reset demo</button>
      </div>
      <output id="status" aria-live="polite">Nothing confirmed yet.</output>
    </main>

    <script type="module">
      import { holdButton } from './src/index.js';

      const status = document.querySelector('#status');
      const deleteControl = holdButton('#delete-button', {
        duration: 1600,
        variant: 'danger',
        onComplete: () => { status.value = 'Delete confirmed.'; }
      });
      const archiveControl = holdButton('#archive-button', {
        duration: 900,
        onComplete: () => { status.value = 'Archive confirmed.'; }
      });

      document.querySelector('#reset-button').addEventListener('click', () => {
        deleteControl.reset();
        archiveControl.reset();
        status.value = 'Ready again.';
      });
    </script>
  </body>
</html>
